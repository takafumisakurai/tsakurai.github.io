name: Measurement release checks
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measurement-checks:
    name: Routing, consent and published library
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Routing, consent, pageview and source checks
        run: node tests/release-checks.cjs
      - name: Isolated Web SDK behavior
        run: node tests/web-sdk-lab.test.cjs
      - name: Target Lab consent and delivery behavior
        run: node tests/target-lab.test.cjs
      - name: JavaScript syntax
        run: python3 tests/check-syntax.py
      - name: Verify published Launch and record site / library pairing
        run: node tests/verify-published-library.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: measurement-release-pairing
          path: artifacts/release-pairing.json
          if-no-files-found: error
