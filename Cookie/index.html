<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Cookie 読み取りサンプル</title>
    <!-- Adobe Launch タグ -->
    <script src="/js/measurement.js?v=4209ba401d0d"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 1rem;
        }

        pre {
            background: #f5f5f5;
            padding: 1rem;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <h1>Cookie 読み取りサンプル</h1>
    <p>Cookie 名だけを表示します。値はマスクされ、計測には送信されません。</p>
    <pre id="cookie-output">読み取り中...</pre>

    <script>
        // ドキュメントに設定されているすべての Cookie を文字列で取得
        const cookieString = document.cookie;
        // "key1=val1; key2=val2; ..." の形式からオブジェクトに変換
        const cookies = cookieString
            .split('; ')
            .filter(entry => entry.includes('='))
            .reduce((obj, entry) => {
                const [rawKey, rawVal] = entry.split('=');
                const key = rawKey.trim();
                const val = decodeURIComponent(rawVal);
                obj[key] = '[masked]';
                return obj;
            }, {});

        // ページに出力
        const output = document.getElementById('cookie-output');
        if (Object.keys(cookies).length === 0) {
            output.textContent = '取得できる Cookie がありません。';
        } else {
            output.textContent = JSON.stringify(cookies, null, 2);
        }

        // コンソールにも出力
        // Cookie values are never logged.
    </script>
</body>

</html>
