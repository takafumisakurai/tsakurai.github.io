<!DOCTYPE html>
<html lang="ja">

<head>

            font-family: sans-serif;
            padding: 2em;

        h1 {
            color: #2a7ae2;

    </style>
    <script>
        // ページ読み込み時に認証フラグをチェック
        if (sessionStorage.getItem('authenticated') !== 'true') {

            window.location.href = 'index.html';
        }
    </script>
</head>
