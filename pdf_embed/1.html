<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <title>PDF Embed API 最小サンプル</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!-- Adobe Launch -->
    <script src="/js/measurement.js?v=a9ce3351d431"></script>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        #adobe-dc-view {
            height: 100vh;
        }

        /* SIZED_CONTAINER用 */
    </style>
</head>

<body>
    <button type="button" id="open-pdf">Open sample PDF with Adobe viewer</button><p id="pdf-status" role="status"></p><div id="adobe-dc-view"></div>
    <script src="/js/pdf-measurement.js"></script>
    <script>
        document.getElementById("open-pdf").addEventListener("click", async function () {
            try { await window.tsPDF.load(); } catch (_) { document.getElementById("pdf-status").textContent="PDF viewer unavailable"; return; }
            const view = new AdobeDC.View({
                clientId: "fec3f02aaf1c480e9efae98d74f8540c",
                divId: "adobe-dc-view",
                sendAutoPDFAnalytics: false
            });
            window.tsPDF.listen(view, "bodea-brochure");
            view.previewFile(
                {
                    content: {
                        location: {
                            url: "https://acrobatservices.adobe.com/view-sdk-demo/PDFs/Bodea%20Brochure.pdf"
                        }
                    },
                    metaData: { fileName: "Bodea-Brochure.pdf" }
                },
                {
                    embedMode: "SIZED_CONTAINER",     // FULL_WINDOW / LIGHT_BOX も可
                    defaultViewMode: "FIT_PAGE",
                    showDownloadPDF: true,
                    showPrintPDF: true
                }
            );
        });
    </script>
</body>

</html>
